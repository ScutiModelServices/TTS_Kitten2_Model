# KittenTTS 2 text-to-speech service: N API replicas behind one nginx address. Each replica runs the 1.7B model in its own
# process on the GPU (device `auto`: the GPU when visible, else the CPU, about 6 GB of RAM); the downloaded weights are
# shared through the models volume, the cloned voices through the voices volume.
# Reserves one NVIDIA GPU: needs the NVIDIA Container Toolkit (Docker Desktop on Windows: WSL2 backend with GPU support).
# A host without an NVIDIA GPU cannot start it as is: delete the `resources:` block under `deploy:`.
# Start:  docker compose up -d --build          (callers use http://<host>:29323)
# Scale:  SERVICE_REPLICAS=2 docker compose up -d --build, then: docker compose restart tts_kitten2_model_lb

name: tts_kitten2_model

services:
  tts_kitten2_model:
    build: .
    image: tts_kitten2_model:latest
    restart: unless-stopped
    mem_limit: ${SERVICE_MEM_LIMIT:-0}  # 0 = no cap; a cap makes an out-of-memory kill stay inside this container
    environment:
      SERVICE_ADMIN_PASSWORD: ${SERVICE_ADMIN_PASSWORD:-}
      SERVICE_NUM_THREAD: ${SERVICE_NUM_THREAD:-}
      SERVICE_REPLICAS: ${SERVICE_REPLICAS:-1}  # shown read-only on /admin/
    volumes:
      - tts_kitten2_model_models:/models
      - tts_kitten2_model_voices:/voices
      - tts_kitten2_model_data:/data
    deploy:
      replicas: ${SERVICE_REPLICAS:-1}
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:29323/health')"]
      interval: 15s
      timeout: 5s
      start_period: 300s
    networks: [tts_kitten2_model]

  tts_kitten2_model_lb:
    container_name: tts_kitten2_model_lb
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${SERVICE_PORT:-29323}:29323"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      tts_kitten2_model:
        condition: service_healthy
    networks:
      tts_kitten2_model:
      citadel:
        aliases: [tts_kitten2_model_lb]

volumes:
  tts_kitten2_model_models:
    name: tts_kitten2_model_models
  tts_kitten2_model_voices:
    name: tts_kitten2_model_voices
  tts_kitten2_model_data:
    name: tts_kitten2_model_data
networks:
  # Other stacks reach http://tts_kitten2_model_lb:29323 by joining this network.
  tts_kitten2_model:
    name: tts_kitten2_model
  citadel:
    name: citadel_core
    external: true
