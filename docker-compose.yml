# KittenTTS 2 text-to-speech service: N API replicas behind one nginx address. Each replica runs the 1.7B model in its own
# process on the CPU, so RAM use is per replica (measure it; the model card gives no figure); the downloaded weights are
# shared through the models volume, the cloned voices through the voices volume.
# Start:  docker compose up -d --build          (callers use http://<host>:9250)
# Scale:  KITTEN2_REPLICAS=2 docker compose up -d --build, then: docker compose restart kitten2_lb

name: kitten2

services:
  kitten2:
    build: .
    restart: unless-stopped
    mem_limit: ${KITTEN2_MEM_LIMIT:-0}  # 0 = no cap; a cap makes an out-of-memory kill stay inside this container
    environment:
      KITTEN2_ADMIN_PASSWORD: ${KITTEN2_ADMIN_PASSWORD:-}
      KITTEN2_NUM_THREAD: ${KITTEN2_NUM_THREAD:-}
      KITTEN2_REPLICAS: ${KITTEN2_REPLICAS:-1}  # shown read-only on /admin/
    volumes:
      - models:/models
      - voices:/voices
      - tokens:/data
    deploy:
      replicas: ${KITTEN2_REPLICAS:-1}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9250/health')"]
      interval: 15s
      timeout: 5s
      start_period: 300s
    networks: [kitten2]

  kitten2_lb:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${KITTEN2_PORT:-9250}:9250"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      kitten2:
        condition: service_healthy
    networks: [kitten2]

volumes:
  models:
  voices:
  tokens:

networks:
  # Other stacks reach http://kitten2_lb:9250 by joining this network.
  kitten2:
